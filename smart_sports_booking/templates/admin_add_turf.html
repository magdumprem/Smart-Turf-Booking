{% extends "base.html" %}

{% block title %}Add Turf - TurfZone{% endblock %}

{% block content %}

<style>
    .add-page {
        max-width: 850px;
        margin: 0 auto;
        padding: 45px 20px 70px;
    }

    .add-header {
        margin-bottom: 28px;
    }

    .add-header h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 800;
    }

    .add-header p {
        color: #777;
        margin-top: 8px;
    }

    .add-card {
        background: white;
        border: 1px solid #eeeeee;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #222;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 14px;
        border: 1px solid #dddddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: #6255f5;
        box-shadow: 0 0 0 3px rgba(98, 85, 245, 0.10);
    }

    .form-group textarea {
        min-height: 120px;
        resize: vertical;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 28px;
    }

    .btn {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .btn-primary {
        background: #6255f5;
        color: white;
    }

    .btn-primary:hover {
        background: #5144df;
        color: white;
    }

    .btn-secondary {
        background: #f2f0ff;
        color: #5b45d0;
    }

    .btn-secondary:hover {
        background: #e7e3ff;
        color: #4c38bd;
    }

    .required {
        color: #d32f2f;
    }

    @media (max-width: 650px) {
        .add-card {
            padding: 22px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .form-actions {
            flex-direction: column;
        }

        .form-actions .btn {
            text-align: center;
        }
    }
</style>


<div class="add-page">

    <div class="add-header">

        <h1>
            Add New Turf
        </h1>

        <p>
            Add a new sports ground to TurfZone.
        </p>

    </div>


    <div class="add-card">

        <form
            method="POST"
            action="{{ url_for('admin_add_turf') }}"
        >

            <!-- TURF NAME -->

            <div class="form-group">

                <label for="name">
                    Turf Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. Premium Football Arena"
                    required
                >

            </div>


            <!-- LOCATION + SPORT -->

            <div class="form-row">

                <div class="form-group">

                    <label for="location">
                        Location
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Kolhapur"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="sport_type">
                        Sport Type
                        <span class="required">*</span>
                    </label>

                    <select
                        id="sport_type"
                        name="sport_type"
                        required
                    >

                        <option value="">
                            Select Sport
                        </option>

                        <option value="Football">
                            Football
                        </option>

                        <option value="Cricket">
                            Cricket
                        </option>

                        <option value="Badminton">
                            Badminton
                        </option>

                        <option value="Tennis">
                            Tennis
                        </option>

                        <option value="Basketball">
                            Basketball
                        </option>

                        <option value="Volleyball">
                            Volleyball
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price_per_hour">
                    Price Per Hour (₹)
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="price_per_hour"
                    name="price_per_hour"
                    min="1"
                    step="1"
                    placeholder="e.g. 800"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the turf, facilities, lighting, parking, etc."
                ></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a
                    href="{{ url_for('admin_turfs') }}"
                    class="btn btn-secondary"
                >
                    ← Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    + Add Turf
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
